# Render Blueprint: one web service built from the Dockerfile (frontend + API on one address).
# Values marked "sync: false" are asked for once when you create the service; they are never stored in git.
services:
  - type: web
    name: skope-operations-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api
    envVars:
      - key: MONGO_URL            # MongoDB Atlas connection string
        sync: false
      - key: DB_NAME
        value: skope_operations
      - key: JWT_SECRET           # random, generated by Render
        generateValue: true
      - key: ADMIN_EMAIL          # the administrator login
        sync: false
      - key: ADMIN_PASSWORD       # choose a strong password
        sync: false
      - key: SEED_DEMO_USERS      # also create the five role accounts for testing
        value: "true"
      - key: DEMO_PASSWORD        # password shared by those five test accounts
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: /tmp/uploads
